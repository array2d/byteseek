[package]
name = "byteseek"
version = "0.1.0"
edition = "2021"
description = "KV 原生 agent substrate —— agent 的自己（代码/状态/记忆/执行）全在一棵可寻址、可持久、可自改的 kvspace 树"

[[bin]]
name = "byteseek"
path = "src/main.rs"

[dependencies]
# 复用 kvlang runtime-rs：Engine / ffi / 纯净 rwir(term/json/http/kvlanglayout) + 内嵌 stdlib。
# byteseek 只叠加 agent 专属 rwir（byteseek·run/shell·run/python·run）与驱动循环。
kvlang-rs = { path = "../kvlang/runtime-rs" }
